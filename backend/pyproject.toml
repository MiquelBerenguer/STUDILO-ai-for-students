[project]
name = "backend"
version = "1.0.0"
description = "Local-first multi-agent study assistant (backend). Product name: config/brand.json"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "cryptography>=44",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "ftfy>=6.3.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pillow-heif>=1.7.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidocr-onnxruntime>=1.4.4",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.53.0",
    "wordfreq>=3.1.1",
]

[tool.uv]
# Supply-chain hygiene: never resolve packages published in the last 7 days.
exclude-newer = "2026-09-17T00:00:00Z"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
